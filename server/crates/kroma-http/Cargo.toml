[package]
name = "kroma-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "KROMA's two HTTP transports: a curl process per call for the outside world, and a pooled client for the loopback seam between the core and its module sidecars"
license.workspace = true

[dependencies]
anyhow = { workspace = true }
# curl's header dump goes to a guarded temp file, so a failed spawn leaves none.
tempfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The loopback transport's pooled client, and the runtime it drives futures on.
# No TLS feature: this seam is plain http on 127.0.0.1, and a sidecar that links
# a TLS stack it can never use pays for it in bytes.
reqwest = { workspace = true }
tokio = { workspace = true }
# Query-string encoding for the loopback builder, so `mod.rs` composes a URL
# without reaching into whichever transport ends up carrying it.
form_urlencoded = "1"

[dev-dependencies]
kroma-testing = { workspace = true }
