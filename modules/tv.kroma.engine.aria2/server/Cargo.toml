# This module is its own cargo workspace: it builds standalone, outside the
# server tree, and is packed into a `.kmod` on its own. Package metadata and
# dependency versions are explicit here rather than inherited.
[workspace]

[package]
name = "kroma-aria2"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "KROMA aria2 download engine: a sidecar answering the download-client point over aria2's JSON-RPC API."
license = "MIT"

[[bin]]
# This module's `.kmod` entrypoint: a point-provider-only sidecar serving the
# aria2 engine over HTTP (see src/bin/module.rs).
name = "kroma-module-aria2"
path = "src/bin/module.rs"

[dependencies]
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk" }
# The out-of-process runtime + axum for the point's routes.
kroma-module-runtime = { path = "../../../server/crates/kroma-module-runtime" }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
# `oneshot`, to drive the point's routes without binding a port.
tower = { version = "0.5", features = ["util"] }
# The shared HostCtx double, for the routes' state.
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk", features = ["testing"] }
# The fake JSON-RPC server's temp files.
kroma-testing = { path = "../../../server/crates/kroma-testing" }

# The profile `bun run modules:pack` builds this sidecar with: release + `panic =
# "abort"`. Dropping the unwinding tables makes the binary ~11% smaller at NO
# speed cost (opt-level stays 3). Safe for a sidecar: a panic aborts the module
# process and the supervisor respawns it. Defined per module because a profile is
# only honoured at a workspace root, and each module is now its own workspace.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.release-kmod]
inherits = "release"
panic = "abort"
