name: TV demo

# Builds the browser TV app and deploys it to tv.kroma.tv (the `kroma-tv`
# assets-only Worker, clients/tv-web/wrangler.jsonc). Until now the demo only
# updated when someone ran `bun run deploy:tv-web` by hand, so it silently
# drifted behind main.
#
# The build runs on PRs too, so a change that breaks the demo fails before it
# lands; only pushes to main deploy. Same stance as kit.yml in every respect.
#
# Deploying needs the CLOUDFLARE_API_TOKEN repo secret (Workers Scripts: Edit).
# WITHOUT it the deploy SKIPS with a notice instead of failing red - the demo
# can always be shipped by hand with `bun run deploy:tv-web`.
on:
  push:
    branches: [main]
    paths:
      - 'clients/tv-web/**'
      - 'packages/tv/**'
      - 'packages/ui/**'
      - 'packages/core/**'
      - 'packages/bundler/**'
      - '.github/workflows/tv-web.yml'
  pull_request:
    paths:
      - 'clients/tv-web/**'
      - 'packages/tv/**'
      - 'packages/ui/**'
      - 'packages/core/**'
      - 'packages/bundler/**'
      - '.github/workflows/tv-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + deploy (tv.kroma.tv)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Hard gate on every trigger: typecheck + vite build (the `build` script
      # runs tsc --noEmit first).
      - name: Build the TV app
        run: bun run build:tv-web

      # Soft gate: no token -> skip (not fail). secrets can't be read in a job-
      # level if, so surface it as a step output the deploy step depends on.
      - name: Check for the Cloudflare token
        id: guard
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping the tv.kroma.tv deploy (deploy by hand with 'bun run deploy:tv-web')."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      # dist/ is already built above, so deploy directly rather than via the
      # workspace `deploy` script (which would rebuild it).
      - name: Deploy the TV demo (tv.kroma.tv)
        if: steps.guard.outputs.has_token == 'true'
        working-directory: clients/tv-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler@4 deploy
