<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080, user-scalable=no" />
    <title>KROMA</title>
    <!-- Stated here rather than in a stylesheet so the stage is black from the
         very first frame, before the bundle loads, and the launch never flashes
         a white body. -->
    <style>
      html,
      body,
      #root {
        height: 100%;
      }
      html,
      body {
        margin: 0;
        background: #0a0a0c;
        color-scheme: dark;
      }
      body {
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
